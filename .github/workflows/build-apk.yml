name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java (JDK 17) のセットアップ
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Web用ファイルをwwwフォルダにまとめる
        run: |
          mkdir -p www
          rsync -av --progress . www --exclude .git --exclude .github --exclude www

      - name: CapacitorのインストールとAndroidプロジェクト生成
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "翻訳" "com.oa31.translate" --web-dir="www"
          npx cap add android

      - name: APKのビルド実行
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 完成したAPKをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
